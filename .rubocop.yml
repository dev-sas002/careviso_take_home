# Kept deliberately small: the defaults, plus the handful of relaxations this
# codebase actually warrants. Run it with `bin/lint`.
require:
  - rubocop-rails

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "config/**/*"
    - "db/schema.rb"
    - "node_modules/**/*"
    - "vendor/**/*"
    - "test/**/*"
    - "tmp/**/*"

# Documentation comments are used where they earn their place (the domain
# objects), not mechanically on every class.
Style/Documentation:
  Enabled: false

# Specs are long by nature and read better with the block form.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "lib/tasks/**/*"
    - "db/seeds.rb"

Metrics/MethodLength:
  Max: 20

Layout/LineLength:
  Max: 120

# Seeds and rake tasks print to stdout on purpose.
Rails/Output:
  Exclude:
    - "db/seeds.rb"
    - "lib/tasks/**/*"

# The app predates Rails 7 defaults for these and changing them is churn, not
# improvement.
Rails/SkipsModelValidations:
  Exclude:
    - "spec/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# A frozen-string-literal magic comment on all 65 files is noise in an app that
# does not chase string allocations.
Style/FrozenStringLiteralComment:
  Enabled: false

# There is no i18n in this app; flash copy is English literals on purpose.
Rails/I18nLocaleTexts:
  Enabled: false

# Rake tasks print aligned tables; positional format tokens are the readable
# form there.
Style/FormatStringToken:
  Exclude:
    - "lib/tasks/**/*"

# Migrations generated by `rails g` are left as Rails wrote them.
Style/SymbolProc:
  Exclude:
    - "db/migrate/**/*"
